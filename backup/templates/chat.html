<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{GROUP_NAME}} · 聊天记录备份</title>
<style>
:root{--bg:#f4f4f8;--panel:#ffffff;--text:#1f1f27;--sub:#8a8a99;--line:#e8e8f0;--own:#95ec69;--other:#ffffff;--accent:#7C3AED;--accent2:#EC4899;}
html[data-theme="dark"]{--bg:#16161d;--panel:#1f1f27;--text:#e8e8ef;--sub:#8b8b9c;--line:#2c2c38;--own:#3a6b4a;--other:#262633;}
*{box-sizing:border-box}
/* `hidden` 属性靠 UA 样式表里的 `display:none` 生效，而作者样式 `.msg{display:flex}`
   优先级更高——于是搜索/筛选把 `el.hidden = true` 写上去，消息一条都没消失。
   表现是「输入关键词后整页消息还在，中间冒出一句『没有匹配的消息』」。 */
[hidden]{display:none!important}
body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#7C3AED,#EC4899);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
header .meta{font-size:12.5px;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
header .spacer{flex:1}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:6px 12px;font-size:13px}
.layout{display:flex;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
aside{width:236px;flex:0 0 236px;position:sticky;top:78px;align-self:flex-start;max-height:calc(100vh - 100px);overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.03em}
.search,.filter{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:13px}
.nav a{display:block;padding:5px 8px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px;display:flex;justify-content:space-between}
.nav a:hover{background:var(--bg)}
.nav a span{color:var(--sub)}
main{flex:1;min-width:0}
.day{text-align:center;color:var(--sub);font-size:12px;margin:18px 0 10px}
.msg{display:flex;gap:9px;margin-bottom:14px}
.msg .avatar{width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;background:linear-gradient(135deg,#7C3AED,#EC4899)}
.msg .body{max-width:min(74%,660px);min-width:0}
.msg .who{font-size:12px;color:var(--sub);margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.bubble{background:var(--other);border-radius:16px;padding:9px 13px;border:1px solid var(--line);word-break:break-word;white-space:pre-wrap}
.msg.mine{flex-direction:row-reverse}
.msg.mine .body{text-align:right}
.msg.mine .who{justify-content:flex-end}
.msg.mine .bubble{background:var(--own);text-align:left;border-color:transparent}
.msg img.media{max-width:100%;border-radius:12px;margin-top:6px;cursor:zoom-in;display:block}
.msg .file{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:13px;color:var(--accent);text-decoration:none;word-break:break-all}
.msg .file .hint{color:var(--sub);font-size:11.5px;font-weight:400;white-space:nowrap}
@media(max-width:520px){.msg .file{flex-wrap:wrap}.msg .file .hint{white-space:normal}}
.msg .file.missing,.msg .file.failed{color:var(--text);border-style:dashed;cursor:default}
.msg img.media{background:var(--bg)}
/* 图片放大：自建覆盖层。原来是把 data: 地址新开一个标签页，主流浏览器一律
   当弹窗拦掉，点了毫无反应 (第 38 轮) */
#lightbox{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(8,6,14,.88);padding:24px}
#lightbox.on{display:grid}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
#lightbox .tip{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:12.5px;opacity:.7}
.quote{border-left:3px solid var(--accent);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12.5px;color:var(--sub);margin-bottom:6px}
details.forward{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px;background:var(--bg)}
details.forward summary{cursor:pointer;font-size:13px;font-weight:600}
details.forward .node{font-size:13px;color:var(--sub);margin-top:6px}
footer{max-width:1180px;margin:0 auto;padding:22px 16px 40px;color:var(--sub);font-size:12.5px;text-align:center;line-height:2}
footer a{color:var(--accent);text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:60px 0}
@media(max-width:820px){.layout{flex-direction:column}aside{width:auto;flex:auto;position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="hdrInk" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FDE7F5"/></linearGradient>
        <mask id="hdrGlyph">
          <rect width="32" height="32" fill="#000"/>
          <path fill="#fff" d="M10.9 22.4a4.6 4.6 0 0 1-.9-9.1 6.4 6.4 0 0 1 12.3 1.2 5.1 5.1 0 0 1 1.6 9.9Z"/>
          <rect x="14.7" y="7.2" width="2.6" height="4.4" rx="1.3" fill="#fff"/>
          <path fill="#fff" d="M16 14.6 13.3 11.3h5.4Z"/>
          <circle cx="16" cy="18.2" r="2.1" fill="#000"/>
          <path stroke="#000" stroke-width="2.2" stroke-linecap="round" d="M16 19.8v3.2"/>
        </mask>
      </defs>
      <circle cx="16" cy="16" r="15" fill="#FFFFFF" opacity=".2"/>
      <circle cx="16" cy="16" r="14.8" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.4"/>
      <rect width="32" height="32" fill="url(#hdrInk)" mask="url(#hdrGlyph)"/>
    </svg>
    <span>{{GROUP_NAME}}</span>
  </div>
  <div class="meta">
    <span>群号 {{GROUP_ID}}</span>
    <span>{{BACKUP_LABEL}}</span>
    <span>{{MEMBER_COUNT}} 人</span>
    <span>{{MESSAGE_COUNT}} 条消息</span>
    <span>{{TIME_RANGE}}</span>
  </div>
  <div class="spacer"></div>
  <button id="themeBtn" type="button">暗色模式</button>
</header>
<div class="layout">
  <aside>
    <div class="card">
      <h3>搜索</h3>
      <input class="search" id="search" type="search" placeholder="搜索昵称或内容…">
    </div>
    <div class="card">
      <h3>成员筛选</h3>
      <select class="filter" id="senderFilter"><option value="">全部成员</option>{{SENDER_OPTIONS}}</select>
    </div>
    <div class="card">
      <h3>日期导航</h3>
      <div class="nav">{{DAY_NAV}}</div>
    </div>
  </aside>
  <main id="chat">{{MESSAGES_HTML}}<div class="empty" id="noResult" hidden>没有匹配的消息</div></main>
</div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
  <img alt="">
  <div class="tip">点击任意处或按 Esc 关闭</div>
</div>
<footer>
  由 <strong>Backup 高级备份</strong> 插件导出 · 作者 科技酱<br>
  <a href="https://www.asoe.cn" target="_blank" rel="noopener">www.asoe.cn</a> ·
  <a href="https://docs.asoe.cn" target="_blank" rel="noopener">技术文档</a> ·
  <a href="https://github.com/techjiang/" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://space.bilibili.com/1768832152" target="_blank" rel="noopener">哔哩哔哩</a> ·
  <a href="mailto:official@tech.asoe.cn">official@tech.asoe.cn</a>
</footer>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeBtn');
  var saved=null; try{saved=localStorage.getItem('backup-theme')}catch(e){}
  if(saved){root.setAttribute('data-theme',saved);}
  btn.textContent=root.getAttribute('data-theme')==='dark'?'亮色模式':'暗色模式';
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    btn.textContent=next==='dark'?'亮色模式':'暗色模式';
    try{localStorage.setItem('backup-theme',next)}catch(e){}
  });

  var search=document.getElementById('search'), filter=document.getElementById('senderFilter');
  var msgs=[].slice.call(document.querySelectorAll('.msg'));
  var days=[].slice.call(document.querySelectorAll('.day'));
  var noResult=document.getElementById('noResult');
  function apply(){
    var q=(search.value||'').trim().toLowerCase(), who=filter.value;
    var any=false;
    for(var i=0;i<msgs.length;i++){
      var el=msgs[i];
      var okQ=!q||(el.dataset.text||'').indexOf(q)>=0;
      var okW=!who||el.dataset.sender===who;
      var show=okQ&&okW;
      el.hidden=!show; if(show)any=true;
    }
    for(var j=0;j<days.length;j++){
      var d=days[j], next=d.nextElementSibling, visible=false;
      while(next&&!next.classList.contains('day')){
        if(next.classList.contains('msg')&&!next.hidden){visible=true;break;}
        next=next.nextElementSibling;
      }
      d.hidden=!visible;
    }
    noResult.hidden=any;
  }
  search.addEventListener('input',apply); filter.addEventListener('change',apply);

  /* 图片放大用自建覆盖层。原来是把 data: 地址新开一个标签页（第 38 轮）：
     主流浏览器一律当弹窗拦掉，点了没反应，而缩略图本身又小得看不清。 */
  var box=document.getElementById('lightbox'), boxImg=box.querySelector('img');
  function closeBox(){ box.classList.remove('on'); boxImg.removeAttribute('src'); }
  document.addEventListener('click',function(e){
    var img=e.target.closest?e.target.closest('img.media'):null;
    if(img){ boxImg.src=img.getAttribute('src'); boxImg.alt=img.alt||''; box.classList.add('on'); return; }
    if(box.classList.contains('on')){ closeBox(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeBox(); });
})();
</script>
</body>
</html>
