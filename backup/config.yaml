backup:
  # 留空 = ~/.astrbot-backup，刻意避开插件目录（插件常落在面板静态托管的 data 下）
  storage_dir: ""

  storage:
    # 备份目录不允许落在这些路径内，防止被 Web 直接下载
    web_roots: []

  scope:
    group_messages: true
    private_messages: false
    group_announcements: true
    group_files: true
    group_members: true
    download_media: true

  media:
    max_file_size: "100MB"
    max_concurrent: 3
    retry_count: 3
    timeout: 30

  schedule:
    enabled: true
    default_cron: "0 3 * * *"

  retention:
    keep_days: 90
    keep_count: 30
    auto_clean: true

  export:
    default_format: "sqlite"
    download_link_expire: "24h"
    # 下载链接前缀，最终链接是 <base_url>/<token>。
    # 留空时自动用面板的公网地址拼成 <面板>/api/backup/download（该前缀在
    # AstrBot 4.14 的鉴权白名单里，群成员直接点就能下）。
    # 自建网关就填网关上兑换 token 的地址。
    base_url: ""

  permission:
    require_admin: true
    allow_private: true

  incremental:
    enabled: true

  auto_trigger:
    mass_leave_threshold: 10
    on_group_disband: true
    on_bot_kicked: true
