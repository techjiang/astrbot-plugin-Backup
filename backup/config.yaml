backup:
  storage_dir: "storage"

  scope:
    group_messages: true
    private_messages: false
    group_announcements: true
    group_files: true
    group_members: true
    download_media: true

  media:
    max_file_size: "100MB"
    max_concurrent: 3
    retry_count: 3
    timeout: 30

  schedule:
    enabled: true
    default_cron: "0 3 * * *"

  retention:
    keep_days: 90
    keep_count: 30
    auto_clean: true

  export:
    default_format: "sqlite"
    download_link_expire: "24h"

  permission:
    require_admin: true
    allow_private: true

  incremental:
    enabled: true

  auto_trigger:
    mass_leave_threshold: 10
    on_group_disband: true
