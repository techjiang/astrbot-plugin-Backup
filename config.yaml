backup:
  # 留空 = ~/.astrbot-backup，刻意避开插件目录（插件常落在面板静态托管的 data 下）
  storage_dir: ""

  storage:
    # 备份目录不允许落在这些路径内，防止被 Web 直接下载
    web_roots: []

  scope:
    group_messages: true
    private_messages: false
    group_announcements: true
    group_files: true
    group_members: true
    download_media: true

  media:
    max_file_size: "100MB"
    max_concurrent: 3
    retry_count: 3
    timeout: 30

  schedule:
    enabled: true
    default_cron: "0 3 * * *"

  retention:
    keep_days: 90
    keep_count: 30
    auto_clean: true

  export:
    default_format: "sqlite"
    download_link_expire: "24h"
    # 下载链接的对外前缀，最终链接是 <base_url>/backup/download/<token>。
    # 填反向代理/内网穿透指向网关的地址，例如 https://bak.example.com。
    # 留空 = 用网关本机回环地址，那种链接只有本机能打开，发到群里点不动。
    base_url: ""

  # 内置下载网关。为什么需要它：AstrBot 4.14 的 dashboard 里
  #   - srv_plug_route 用 `route == f"/{subpath}"` 做精确字符串比较，
  #     注册成 "/backup/download/<token>" 的路由永远比不中任何真实路径；
  #   - auth_middleware 的白名单是源码常量，只放行 /api/backup/download，
  #     而那条已经被宿主自己的 BackupRoute 占了。
  # 两条一起把「把链接挂在面板上」这条路堵死，所以群内下载链接只能由网关提供。
  gateway:
    enabled: true
    host: "127.0.0.1"
    port: 0

  permission:
    require_admin: true
    allow_private: true

  incremental:
    enabled: true

  auto_trigger:
    mass_leave_threshold: 10
    on_group_disband: true
    on_bot_kicked: true
