# AstrBot 插件元数据。
#
# 上半部分是宿主**真的会读**的字段（`PluginManager._load_plugin_metadata` +
# `_PluginUpdater.validate_plugin_metadata`）；下半部分宿主不读，是写给人、
# 给插件市场看的。混在一起最容易出的错是：以为改了个名字，面板上却纹丝不动。
#
# 宿主必填（缺一个直接抛「插件元数据信息不完整」）：name / desc / version / author
name: backup
display_name: Backup
short_desc: 群聊消息 / 媒体 / 成员全量备份、增量备份、多格式导出与一键恢复
desc: |
  AstrBot 群聊数据备份插件：把群里的消息、媒体、成员、群信息全量或增量存下来，
  支持手动 / 定时 / 触发式备份，7 种导出格式，以及从备份包一键恢复。

  - 实时归档：消息进群即写库（只写库不下媒体），群被炸、机器人被踢时数据还在
  - 增量备份：以「库里有没有这条」判断增量，撞上断点接着补，2 万条消息约 4 秒
  - 导出：SQLite / JSON / CSV / TXT / Markdown / 自包含 HTML 聊天记录 / ZIP（含媒体）
  - 恢复：恢复前比对校验和，skip / overwrite / merge 三种冲突策略，支持恢复到别的群
  - 定时：cron 定时备份；退群激增、群解散、机器人被踢自动补一次

  导出链接带一次性 token 且会过期；备份文件默认落在插件目录之外的 ~/.astrbot-backup。
version: 1.0.0
author: 科技酱
repo: "https://github.com/techjiang/astrbot-plugin-Backup"

# 宿主版本不满足这一条就**拒绝加载**（`_validate_astrbot_version_specifier`）。
# 下限取 4.14：钩子必须挂在任意事件上（`CustomFilter`），命令过滤器会把实时归档
# 和退群聚合全饿死；实测环境是 4.14.6，上限留给将来。
astrbot_version: ">=4.14,<5"

# 面板插件页展示的平台标签（`StarMetadata.support_platforms`）。
#
# 只列「真能把历史消息、成员名单、公告拉下来」的平台。备份的数据全部来自平台的
# 历史消息接口，而 AstrBot 的适配器大多只做「收消息、转事件」，没有回捞历史的
# 入口——写进这里等于承诺一个备不出东西的平台，用户装完只会看到「0 条 / failed」。
#
# 目前只有 aiocqhttp 透得出 OneBot 的 get_group_msg_history /
# get_group_member_list / get_group_info（NapCat、Lagrange、go-cqhttp 都走它）。
# 其他平台**实时归档仍可用**——消息进群即落库走的是事件钩子，与平台无关；
# 但没有历史消息。这条界线写在 README「支持平台」一节。
# 名单的唯一来源是 core/platforms.py::HISTORY_PLATFORMS，两处由用例锁死不许漂。
support_platforms:
  - aiocqhttp

# ---- 插件市场字段，宿主不读，市场读取端认 ----
#
# `category` 是市场里的**单值分类 key**，不是自由文本。市场源里实际在用的只有这五个：
#   entertainment（娱乐）/ utilities（工具）/ ai_tools（AI 工具）
#   / integrations（集成）/ productivity（效率）
# 「工具」对应 `utilities`。
category: utilities

# 市场分类与搜索关键词。市场按 tags 做搜索，中英混排是常态
# （市场源里 1300 多个插件有 780 个带中文标签），所以两边都给。
tags:
  - backup
  - restore
  - export
  - chat-history
  - message-archive
  - data-migration
  - sqlite
  - zip
  - 备份
  - 工具
  - 群聊
  - 导出
  - 恢复

